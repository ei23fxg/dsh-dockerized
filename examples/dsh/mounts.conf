# Permanente Zusatz-Mounts für dsh-dockerized (ein Mount pro Zeile).
# Leerzeilen und Zeilen mit # werden ignoriert; führendes ~ wird expandiert.
#
#   <host-pfad>:<container-pfad>[:ro|:rw]
#
# rw gibt dem Agenten Schreibrecht dort — trage nur Pfade ein, die DSH anfassen darf.
# Beispiele:

#~/geteilt:/shared:ro
#/srv/datensatz:/daten
#/opt/resolve/bin/ResolveMCP:/opt/resolve/bin/ResolveMCP
